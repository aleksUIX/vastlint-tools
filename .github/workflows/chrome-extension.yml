name: Chrome Extension
'on':
  push:
    branches:
      - main
    paths:
      - chrome/**
      - core-version.txt
      - .github/workflows/chrome-extension.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Chrome Web Store
        type: boolean
        default: false
        required: false
      version:
        description: Version to set (e.g. 0.4.9). Leave blank to use manifest.json version.
        type: string
        default: ''
        required: false
  pull_request:
    branches:
      - main
    paths:
      - chrome/**
      - core-version.txt
      - .github/workflows/chrome-extension.yml
permissions:
  contents: read
jobs:
  build-chrome:
    name: Build Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Set manifest version
        if: ${{ inputs.version != '' }}
        working-directory: chrome
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            if (!version) throw new Error('VERSION input is required');
            const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
            m.version = version;
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
            if (m.version !== process.env.VERSION) {
              throw new Error('manifest.json version mismatch: ' + m.version);
            }
          "
          echo "Stamped manifest.json to version $VERSION"
      - name: Install extension dependencies
        working-directory: chrome
        run: npm ci
      - name: Build extension
        working-directory: chrome
        run: npm run build
      - name: Test extension assets and watch updates
        working-directory: chrome
        run: npm test
      - name: Verify build output
        working-directory: chrome
        run: |
          REQUIRED=(
            dist/manifest.json
            dist/content.js
            dist/service-worker.js
            dist/popup.js
            dist/popup.html
            dist/vastlint_wasm_bg.wasm
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $f"
            fi
          done
          [ "$MISSING" -eq 0 ] || { echo "$MISSING required file(s) missing from dist/"; exit 1; }
      - name: Zip dist/
        working-directory: chrome
        run: |
          cd dist
          zip -r ../vastlint-extension.zip .
          echo "Archive size: $(du -sh ../vastlint-extension.zip | cut -f1)"
      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vastlint-extension.zip
          path: chrome/vastlint-extension.zip
          retention-days: 7
  publish-chrome:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    needs: build-chrome
    if: ${{ inputs.publish == true }}
    steps:
      - name: Download extension zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: vastlint-extension.zip
          path: chrome
      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4
        with:
          file-path: chrome/vastlint-extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
