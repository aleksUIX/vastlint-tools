name: CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
permissions:
  contents: read
jobs:
  javascript-audit:
    name: JavaScript audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - vscode
          - chrome
          - examples/vastlint-client-browser
          - examples/vastlint-client-react-scratch
          - examples/vastlint-react-demo
          - scripts/ecosystem-smoke/vastlint-client-smoke
          - scripts/ecosystem-smoke/vastlint-react-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          check-latest: true
      - name: Audit runtime and development dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=low
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.91'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: cargo build
        run: cargo build --all
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
  mcp-smoke:
    name: MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Build vastlint-mcp
        run: cargo build --release -p vastlint-mcp
      - name: 'MCP smoke : initialize + tools/list returns 7 tools'
        run: "RESPONSE=$(\n  (\n    echo '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\"\
          :\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"ci\",\"version\":\"1.0\"}}}'\n    sleep 0.2\n   \
          \ echo '{\"jsonrpc\":\"2.0\",\"method\":\"notifications/initialized\",\"params\":{}}'\n    sleep 0.2\n    echo '{\"\
          jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\",\"params\":{}}'\n    sleep 1\n  ) | ./target/release/vastlint-mcp\
          \ 2>/dev/null\n)\n\n# capabilities must include tools\necho \"$RESPONSE\" | grep -q '\"tools\"' || {\n  echo \"\
          FAIL: initialize response missing tools capability\"\n  echo \"$RESPONSE\"\n  exit 1\n}\necho \"capabilities.tools\
          \ present \u2713\"\n\n# tools/list must return exactly 7 tools\nTOOL_COUNT=$(echo \"$RESPONSE\" | grep '\"tools\"\
          :\\[' | grep -o '\"name\":\"' | wc -l | tr -d ' ')\nif [ \"$TOOL_COUNT\" -ne 7 ]; then\n  echo \"FAIL: expected\
          \ 7 tools, got $TOOL_COUNT\"\n  echo \"$RESPONSE\"\n  exit 1\nfi\necho \"tools/list returned $TOOL_COUNT tools \u2713\
          \"\n\n# each expected tool must be present\nfor TOOL in validate_vast validate_vast_url fix_vast list_rules explain_rule\
          \ inspect_vast; do\n  echo \"$RESPONSE\" | grep -q \"\\\"$TOOL\\\"\" || {\n    echo \"FAIL: tool '$TOOL' missing\
          \ from tools/list\"\n    echo \"$RESPONSE\"\n    exit 1\n  }\n  echo \"  $TOOL \u2713\"\ndone\n"
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: cargo doc
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
  javascript:
    name: Frontend packages and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check public core version pins
        run: npm run check:core
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck frontend packages
        run: npm run typecheck
      - name: Test frontend packages
        run: npm test
      - name: Test publication recovery
        run: npm run test:release
      - name: Build browser example
        working-directory: examples/vastlint-client-browser
        run: |-
          npm ci
          npm run build
      - name: Build React example
        working-directory: examples/vastlint-react-demo
        run: |-
          npm ci
          npm run build
      - name: Build React scratch example
        working-directory: examples/vastlint-client-react-scratch
        run: |-
          npm ci
          npm run build
      - name: Test IDE extension
        working-directory: vscode
        run: |-
          npm ci
          npm test
          npm run bundle
      - name: Test Chrome extension
        working-directory: chrome
        run: |-
          npm ci
          npm run build
          npm test
  docker:
    name: MCP container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
