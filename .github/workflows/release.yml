name: Release tools
'on':
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tools tag to build and publish
        type: string
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  smoke-test:
    name: Test MCP against the published core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Test MCP and IDE catalog documentation
        run: cargo test --workspace --locked
      - name: Run MCP release checks
        run: bash test/mcp-release-smoke.sh
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: smoke-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: vastlint-mcp
            crate: vastlint-mcp
            archive: vastlint-mcp-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: vastlint-mcp
            crate: vastlint-mcp
            archive: vastlint-mcp-linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: vastlint-mcp
            crate: vastlint-mcp
            archive: vastlint-mcp-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: vastlint-mcp
            crate: vastlint-mcp
            archive: vastlint-mcp-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Stamp MCP package version without changing the core pin
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os,re
          version=os.environ["RELEASE_TAG"].removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",version):raise ValueError("Invalid tools release tag")
          p=Path("crates/vastlint-mcp/Cargo.toml")
          p.write_text(re.sub(r'^version = "[^"]*"$',f'version = "{version}"',p.read_text(),flags=re.M))
          PYCODE
      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
      - name: Set up cross toolchain (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8
        with:
          target: ${{ matrix.target }}
      - name: Build (cargo)
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.crate }}
      - name: Package
        run: |
          BINARY=target/${{ matrix.target }}/release/${{ matrix.binary }}
          tar czf "${{ matrix.archive }}" -C "$(dirname "$BINARY")" "$(basename "$BINARY")" -C "$GITHUB_WORKSPACE" LICENSE NOTICE
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
  build-js:
    name: Build and test frontend packages
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check core dependency pins
        run: npm run check:core
      - name: Install workspace dependencies
        run: npm ci
      - name: Run frontend package tests
        run: npm test
      - name: Test publication recovery
        run: npm run test:release
      - name: Prepare tool npm packages
        run: |-
          VERSION="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
          node scripts/prepare-js-release-packages.mjs "$VERSION" .release/js-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tool-js-packages
          path: .release/js-packages
          retention-days: 14
  build-extensions:
    name: Build ${{ matrix.directory }} extension
    runs-on: ubuntu-latest
    needs: smoke-test
    strategy:
      fail-fast: false
      matrix:
        directory:
          - chrome
          - vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Stamp application version
        env:
          TOOL_DIRECTORY: ${{ matrix.directory }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const directory = process.env.TOOL_DIRECTORY;
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable tools release tag');
          for (const name of ['package.json', 'package-lock.json', ...(directory === 'chrome' ? ['manifest.json'] : [])]) {
            const file = directory + '/' + name;
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            if (data.packages && data.packages['']) data.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          JS
      - name: Install application dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Test application
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Build Chrome extension
        if: matrix.directory == 'chrome'
        working-directory: chrome
        run: |-
          npm run build
          cd dist
          zip -r ../vastlint-extension.zip .
      - name: Package VS Code extension
        if: matrix.directory == 'vscode'
        working-directory: vscode
        run: npx --no-install vsce package --no-update-package-json --out vastlint.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: extension-${{ matrix.directory }}
          path: |-
            ${{ matrix.directory }}/vastlint-extension.zip
            ${{ matrix.directory }}/vastlint.vsix
          if-no-files-found: error
          retention-days: 14
  classify:
    name: Classify release
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      needs_approval: ${{ steps.bump.outputs.needs_approval }}
    steps:
      - name: Compare tag to previous version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          needs_approval=true
          bump="unknown"

          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            C_MAJ="${BASH_REMATCH[1]}"
            C_MIN="${BASH_REMATCH[2]}"

            PREV=""
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              tv="${t#v}"
              lowest=$(printf '%s\n%s\n' "$tv" "$VERSION" | sort -V | head -n1)
              if [ "$lowest" != "$tv" ] || [ "$tv" = "$VERSION" ]; then
                continue
              fi
              if [ -z "$PREV" ]; then
                PREV="$t"
                continue
              fi
              highest=$(printf '%s\n%s\n' "${PREV#v}" "$tv" | sort -V | tail -n1)
              if [ "$highest" = "$tv" ]; then
                PREV="$t"
              fi
            done < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
                --jq '.[].ref | sub("refs/tags/"; "")' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vx "$TAG" \
              || true
            )

            if [ -n "$PREV" ]; then
              IFS=. read -r P_MAJ P_MIN _ <<< "${PREV#v}"
              if [ "$C_MAJ" != "$P_MAJ" ]; then
                bump="major"
              elif [ "$C_MIN" != "$P_MIN" ]; then
                bump="minor"
              else
                bump="patch"
                needs_approval=false
              fi
              echo "Previous tag ${PREV} -> ${TAG} (${bump})"
            else
              bump="initial"
              echo "No previous version tag; requiring approval"
            fi
          else
            echo "Ref ${TAG} is not vMAJOR.MINOR.PATCH; requiring approval"
          fi

          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "needs_approval=${needs_approval}" >> "$GITHUB_OUTPUT"
  wait-for-approval:
    name: Approve release
    needs:
      - classify
      - smoke-test
      - build
      - build-js
      - build-extensions
    runs-on: ubuntu-latest
    environment: ${{ needs.classify.outputs.needs_approval == 'false' && 'patch' || 'production' }}
    steps:
      - run: echo "Release approved (${{ needs.classify.outputs.bump }}); publish jobs may proceed"
  approve:
    name: Release gate
    needs:
      - wait-for-approval
      - classify
      - smoke-test
      - build
      - build-js
      - build-extensions
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release gate passed (${{ needs.classify.outputs.bump }})"
  release:
    name: Create GitHub Release
    needs:
      - approve
      - build
      - build-js
      - build-extensions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract changelog section for this release
        id: changelog
        run: |
          # Pull the section for this tag (e.g. "## [0.3.7]") from CHANGELOG.md.
          # Outputs everything between this heading and the next "## " heading.
          VERSION="${RELEASE_TAG#v}"
          BODY=$(awk "/^## \[?${VERSION}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](https://github.com/aleksUIX/vastlint-tools/blob/main/CHANGELOG.md) for details."
          fi
          printf '%s\n' "$BODY" > /tmp/release-notes.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          this="${TAG#v}"
          highest=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --jq '.[].ref | sub("refs/tags/"; "")' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1
          )
          if [ "$this" = "$highest" ]; then
            latest_flag=(--latest)
          else
            latest_flag=(--latest=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md "${latest_flag[@]}"
          mapfile -t files < <(
            find artifacts -type f \( -name '*.tar.gz' -o -name '*.vsix' -o -name '*.zip' \) | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release artifacts to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
  provenance:
    name: SLSA provenance attestation
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |-
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.vsix
  publish-npm:
    name: Publish to npm
    needs:
      - approve
      - build-js
      - release
    runs-on: ubuntu-latest
    if: vars.ENABLE_NPM_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tool-js-packages
          path: .release/js-packages
      - name: Publish client and React packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/publish-js-packages.sh .release/js-packages
  publish-vscode:
    name: Publish VS Code Extension
    needs:
      - approve
      - build-extensions
      - release
    runs-on: ubuntu-latest
    if: vars.ENABLE_VSCODE_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: extension-vscode
          path: .release/vscode
      - name: Install publisher tools
        working-directory: vscode
        run: npm ci
      - name: Publish exact VSIX to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        working-directory: vscode
        run: npx --no-install vsce publish --packagePath ../.release/vscode/vastlint.vsix
      - name: Publish exact VSIX to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        working-directory: vscode
        run: npx --no-install ovsx publish ../.release/vscode/vastlint.vsix --pat "$OVSX_TOKEN"
  chrome-extension:
    name: Publish Chrome extension
    runs-on: ubuntu-latest
    needs:
      - approve
      - build-extensions
      - release
    if: vars.ENABLE_CHROME_PUBLISH == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: extension-chrome
          path: chrome
      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4
        with:
          file-path: chrome/vastlint-extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs:
      - approve
      - build
      - release
    runs-on: ubuntu-latest
    if: vars.ENABLE_MCP_REGISTRY_PUBLISH == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download vastlint-mcp linux-x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: vastlint-mcp-linux-x86_64.tar.gz
          path: .
      - name: Patch server.json with version and fileSha256
        run: |
          TAG="${RELEASE_TAG}"          # e.g. v1.2.3
          VERSION="${TAG#v}"                # e.g. 1.2.3
          SHA256=$(openssl dgst -sha256 -hex vastlint-mcp-linux-x86_64.tar.gz \
                    | awk '{print $2}')
          IDENTIFIER="https://github.com/aleksUIX/vastlint-tools/releases/download/${TAG}/vastlint-mcp-linux-x86_64.tar.gz"

          jq \
            --arg v   "$VERSION" \
            --arg sha "$SHA256" \
            --arg url "$IDENTIFIER" \
            '.version = $v | .packages[0].fileSha256 = $sha | .packages[0].identifier = $url' \
            crates/vastlint-mcp/server.json > server.tmp
          mv server.tmp crates/vastlint-mcp/server.json
          echo "Patched server.json:"
          cat crates/vastlint-mcp/server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          mv mcp-publisher crates/vastlint-mcp/mcp-publisher
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
        working-directory: crates/vastlint-mcp
      - name: Publish to MCP Registry
        working-directory: crates/vastlint-mcp
        run: |
          out=$(./mcp-publisher publish 2>&1) && echo "$out" && exit 0
          echo "$out"
          # Treat duplicate-version as success : registry already has this release.
          echo "$out" | grep -q "cannot publish duplicate version" && exit 0
          exit 1
