version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - rust
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - github-actions
  ignore:
  - dependency-name: mnao305/chrome-extension-upload
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /vscode
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: UTC
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - javascript
  ignore:
  - dependency-name: '@types/vscode'
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
    - version-update:semver-patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: UTC
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - javascript
- package-ecosystem: npm
  directory: /chrome
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: UTC
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - javascript
